<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1 style="text-align:center">Sign up Form </h1>
    <hr>
    <label for="user"> Name:</lebel>
        <input type="text" id="user" name="user" placeholder="Your Name"><br>

    <label for="remail"> Email:</lebel>
        <input type="text" id="email" name="email" placeholder="Your Email"><br>

    <label for="pass"> Password:</lebel>
        <input type="text" id="pass" name="pass" placeholder="Your Password"><br>

    <label for="phone">Phone:</lebel><br>
        <select name="code">
            <option value="+880">+880<option>
            <option value="+990">+990<option>
            <option value="+110">+110<option>
        </select>
    <input type="number" id="phone" name="phone" placeholder="123456789" required><br>

     <label for="country"></label>
        <input list="con">
            <datalist id="con">
                <option value="Bangladesh">Bangladesh</option>
                <option value="India">India</option>
                <option value="Canada">Canada</option>
            </datalist>   
    Gender:
    <input type="radio" id="gnd1" name="gender">
        <label for="gnd1">Male</label>
    <input type="radio" id="gnd2" name="gender">
        <label for="gnd2">Female</label><br>
    
    <label for="date"> Date of Birth:</label>
        <input type="date" id="date" name="date"><br>

    <label for ="time"> Time:</label>
        <input type="time" id="time" name="time"><br>

    <label for="color">Color:</label>
        <input type="color" id="color" name="color"><br>

    <label for="file">File</label>
        <input type="file" id="file" name="file"><br>

    <input type="checkbox" id="vehicle1" name="vec">
        <label for="vehicle1">I have a bike</label>
    <input type="checkbox" id="vehicle2" name="vec">
        <label for="vehicle2">I have a bycycle</label><br>
    
    <textarea name="comment" cols="30" rows="10">Comment Here</textarea><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</body>
</html>
